function noise(d,f1,f2,v){if(!ac||!snd)return;const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2;const t=ac.currentTime;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
const sBow=()=>{tone(110,.8,'triangle',.05,0,220);tone(90,.8,'sine',.04,0,160)},sWh=()=>noise(.6,2400,500,.09),sHit=()=>{tone(170,.25,'sine',.14,0,60);tone(880,.35,'triangle',.05,.05);tone(1320,.35,'triangle',.04,.14)},sMiss=()=>{tone(392,.3,'sine',.06);tone(349,.45,'sine',.06,.22)},sWin=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.07,i*.22));
/* animation core */
function tw(ms,fn){const g=gen;ms=RM?ms*.4:ms;return new Promise(r=>{const t0=performance.now();T.push(n=>{if(g!==gen)return false;const p=Math.min(1,(n-t0)/ms);fn(p);if(p>=1){r();return false}return true})})}
const happy=ms=>happyUntil=performance.now()+ms,hop=()=>jumpAt=performance.now();
function burst(x,y){for(let i=0;i<28;i++){const a=Math.random()*6.28,v=150+Math.random()*300;pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-100,g:300,l:.9+Math.random()*.6,col:Math.random()<.5?'#ffd23a':'#fff3a0',t:1,r:6+Math.random()*8,w:0})}}
function conf(){const cs=['#e0262f','#1f5fd1','#ffd23a','#2fb35a','#ff8a1f','#ff7bb0'];for(let i=0;i<2;i++)pt.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*80,vy:80+Math.random()*120,g:30,l:6,col:cs[Math.random()*6|0],t:Math.random()<.2?1:0,r:6+Math.random()*7,w:Math.random()*8-4,a:Math.random()*6})}
function star(x,y,r,a){cx.beginPath();for(let i=0;i<10;i++){const q=a+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(q)*rr,y+Math.sin(q)*rr)}cx.closePath();cx.fill()}
const AIMG=new Image();AIMG.src=ARW;
function arrow(x,y,a,sc,al){if(!AIMG.complete)return;cx.save();cx.globalAlpha=al;cx.translate(x,y);cx.rotate(a);cx.drawImage(AIMG,-436*sc,-24*sc,443*sc,47*sc);cx.restore()}
const bz=(f,t)=>{const u=1-t;return[u*u*f.x0+2*u*t*f.cx+t*t*f.x1,u*u*f.y0+2*u*t*f.cy+t*t*f.y1]},ba=(f,t)=>Math.atan2(2*(1-t)*(f.cy-f.y0)+2*t*(f.y1-f.cy),2*(1-t)*(f.cx-f.x0)+2*t*(f.x1-f.cx));
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d}addEventListener('resize',resize);resize();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;const t=now/1000,m=RM?0:1;T=T.filter(f=>f(now));
 rays.setAttribute('transform',`rotate(${t*6*m})`);clouds.forEach(c=>c.e.setAttribute('transform',`translate(${(c.x+t*c.v*m)%1900-150} ${c.y}) scale(${c.s})`));
 $('#eg').setAttribute('transform',`translate(${(200+t*20*m)%1900-150} ${150+Math.sin(t*.5*m)*20}) scale(1.3 ${1+Math.sin(t*3*m)*.18})`);
 grass.forEach(g=>g.e.setAttribute('transform',`translate(${g.x} ${g.y}) rotate(${Math.sin(t*1.6+g.p)*5*m+g.r}) scale(${g.s})`));
 const hp=now<happyUntil,sp=hp?9:2;$('#wl').setAttribute('transform',`rotate(${-6-Math.sin(t*sp)*(hp?18:6)*(RM?.3:1)} 30 90)`);$('#wr').setAttribute('transform',`rotate(${6+Math.sin(t*sp)*(hp?18:6)*(RM?.3:1)} 110 90)`);
 const bl=(t%3.4)<.18?12:0;$('#l0').setAttribute('ry',bl);$('#l1').setAttribute('ry',bl);
 $('#owl').style.transform=`translateY(${hp?-Math.abs(Math.sin(t*8))*14*(RM?.3:1):0}px)`;
 const jp=(now-jumpAt)/900,jh=happyUntil===Infinity?Math.abs(Math.sin(t*6))*34:(jp>=0&&jp<1?Math.abs(Math.sin(jp*Math.PI*2))*40:0);$('#yc').style.transform=`translateY(${-jh*(RM?.3:1)}px)`;
 [0,1].forEach(i=>{$('#arc'+i).style.transform=`scale(${1+Math.sin(t*1.8+i)*.008*m},${1+Math.sin(t*1.8+i)*.014*m})`});
 const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
 if(now<confUntil)conf();
 if(fl){const[x,y]=bz(fl,fl.p);arrow(x,y,ba(fl,fl.p),fl.s*(1-.4*Math.min(fl.p,1)),fl.miss&&fl.p>1.1?Math.max(0,1-(fl.p-1.1)/.2):1)}
 if(stuck)arrow(stuck.x+sk,stuck.y,stuck.a,stuck.s*.6,1);
 pt=pt.filter(p=>(p.l-=dt)>0);pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;cx.globalAlpha=Math.min(1,p.l*1.5);cx.fillStyle=p.col;if(p.t)star(p.x,p.y,p.r,now/300);else{p.a+=p.w*dt;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}});cx.globalAlpha=1}
requestAnimationFrame(loop);
/* game */
const render=()=>[0,1].forEach(k=>{$('#p'+k).textContent=S.sc[k];$('#q'+k).textContent=S.d[k]+'/5'});

 ans.innerHTML=q.o.map((o,i)=>`<button class="a${q.big?' big':''}" data-i="${i}">${q.p?`<span class="pc">${q.p[i].map(pic).join('')}</span>`:''}<span><i>${LB[i]}</i>${o}</span></button>`).join('');
 res.className='';[0,1].forEach(j=>{$('#sb'+j).classList.toggle('on',j===k);$('#w'+j).classList.toggle('on',j===k);setPull(j,0);$('#ar'+j).style.display=''});
 say(S.i%2?'Асықпай ойлан!':'Ү дыбысын бірге табайық!')}

 bs.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('pick')});S.d[k]++;render();

 const r=$('#arc'+k).getBoundingClientRect(),s=r.width/AW,t=tg.getBoundingClientRect(),X=t.left+t.width/2,Y=t.top+t.height*150/320,R=t.width*140/300,

 fl={x0,y0,x1,y1,cx:(x0+x1)/2,cy:Math.min(y0,y1)-Math.hypot(x1-x0,y1-y0)*.22,p:0,L:62*s,s,miss:!ok};

  await tw(700,p=>{sk=Math.sin(p*28)*(1-p)*7;tg.style.transform=`translateX(${sk}px)`});sk=0;tg.style.transform=''}
 else{fl=null;sMiss();say('Тағы үйреніп келеміз!');await tw(400,()=>{})}
 bs.forEach(b=>b.classList.remove('pick'));if(ok)bs[i].classList.add('ok');else{bs[i].classList.add('no');bs[q.c].classList.add('key')}
 const m=$('#msg');m.className=ok?'g':'w';m.textContent=ok?'Дәл тиді! Жарайсың! +10 ұпай':'Тимеді. Бірге үйренейік!';
 $('#ex').textContent=(ok?'':'Дұрыс жауап: '+LB[q.c]+' '+q.o[q.c]+' ')+q.e;nx.textContent=S.i>=9?'Қорытынды':'Келесі кезек';
 res.className='show';S.phase='result';nx.focus();nx.scrollIntoView({block:'nearest'})}

 $('#f0').textContent=S.n[0]+': '+a+' ұпай';$('#f1').textContent=S.n[1]+': '+b+' ұпай';$('#win').textContent=a>b?S.n[0]+' жеңді!':b>a?S.n[1]+' жеңді!':'Достық жеңді!';
 happyUntil=Infinity;confUntil=performance.now()+7000;for(let i=0;i<3;i++)burst(innerWidth*(.25+.25*i),innerHeight*.4);sWin();say('Жарайсыңдар!');$('#rp').focus()}
ans.addEventListener('click',e=>{const b=e.target.closest('.a');if(b)answer(+b.dataset.i)});
